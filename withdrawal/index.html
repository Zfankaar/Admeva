<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Withdrawals</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f0f0f0;padding:16px;color:#000}
    .wrap{max-width:800px;margin:0 auto}
    h1{font-size:22px;font-weight:900;margin-bottom:4px}
    .sub{font-size:12px;color:#888;margin-bottom:16px}
    .top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .top-bar .left{display:flex;align-items:center;gap:12px}
    .top-bar a{color:#888;text-decoration:none;font-size:13px;font-weight:600}
    .top-bar a:hover{color:#000}
    .top-bar .refresh{padding:10px 20px;border:none;border-radius:10px;background:#000;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
    .top-bar .refresh:hover{background:#333}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    .stats .s{background:#fff;border:2px solid #000;padding:14px 10px;text-align:center;border-radius:12px}
    .stats .s .num{font-size:20px;font-weight:900}
    .stats .s .lbl{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
    .st{color:#2e7d32}
    .sp{color:#e65100}
    .sr{color:#c62828}
    .filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
    .filters .fg{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
    .filters .fg .fl{font-size:10px;font-weight:700;text-transform:uppercase;color:#999;letter-spacing:.3px;margin-right:4px}
    .filters .fbtn{padding:6px 14px;border:2px solid #000;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;transition:all .15s;font-family:inherit}
    .filters .fbtn:hover{background:#f5f5f5}
    .filters .fbtn.active{background:#000;color:#fff;border-color:#000}
    .filters .fbtn.active:hover{background:#222}
    .filter-toggle{display:block;width:100%;padding:8px 14px;border:2px solid #000;border-radius:10px;background:#fff;font-size:11px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:left;font-family:inherit;transition:background .15s}
    .filter-toggle:hover{background:#f5f5f5}
    .filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;overflow:hidden;transition:max-height .3s ease,padding .3s ease,margin .3s ease}
    .filters.hidden{max-height:0;padding:0;margin:0;border:none}
    .filters     .view-toggle{display:flex;gap:8px;margin-bottom:12px}
    .view-toggle .vt{padding:8px 18px;border:2px solid #000;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;font-family:inherit;transition:all .15s}
    .view-toggle .vt:hover{background:#f5f5f5}
    .view-toggle .vt.active{background:#000;color:#fff}
    .usercard{background:#fff;border:2px solid #000;border-radius:14px;padding:18px;cursor:pointer;transition:all .2s}
    .usercard:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(0,0,0,.1)}
    .usercard .uc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .usercard .uc-top .uc-email{font-size:13px;font-weight:800;word-break:break-all}
    .usercard .uc-top .uc-total{font-size:22px;font-weight:900}
    .usercard .uc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .usercard .uc-stats .uc-s{text-align:center;padding:8px;border-radius:8px;background:#f9f9f9}
    .usercard .uc-stats .uc-s .uc-num{font-size:16px;font-weight:900}
    .usercard .uc-stats .uc-s .uc-lbl{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
    .sep{width:1px;background:#ddd;align-self:stretch;margin:0 4px}
    .cards{display:grid;grid-template-columns:1fr;gap:14px}
    .card{background:#fff;border:2px solid #000;border-radius:14px;padding:18px;position:relative}
    .card.suspicious{border-color:#c62828;background:#fff5f5}
    .card.suspicious .susp-badge{position:absolute;top:-8px;right:12px;background:#c62828;color:#fff;font-size:9px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
    .card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .card .top .user{font-size:15px;font-weight:800}
    .card .top .user .email{font-size:11px;font-weight:500;color:#888}
    .card .top .amt{font-size:20px;font-weight:900}
    .card .info{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:12px;background:#f9f9f9;border-radius:10px;padding:12px}
    .card.suspicious .info{background:#fff}
    .card .info .lbl{color:#999;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
    .card .info .val{font-weight:600;word-break:break-all}
    .card .info .copy{cursor:pointer;color:#1565c0;font-weight:700;font-size:11px;margin-left:4px;background:0 0;border:none;font-family:inherit}
    .card .info .copy:hover{color:#0d47a1}
    .card .bot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .card .bot .date{font-size:11px;color:#999}
    .card .bot .actions{display:flex;gap:6px;flex-wrap:wrap}
    .card .bot .actions select{padding:6px 10px;border:2px solid #000;border-radius:8px;font-size:11px;font-weight:700;font-family:inherit;background:#fff;cursor:pointer;outline:none}
    .card .bot .actions .save-btn{padding:6px 14px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:#000;color:#fff}
    .card .bot .actions .save-btn:hover{background:#333}
    .card .bot .actions .save-btn:disabled{opacity:.4;cursor:default}
    .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
    .badge.pending{background:#fff3e0;color:#e65100}
    .badge.completed,.badge.approved{background:#e8f5e9;color:#2e7d32}
    .badge.rejected{background:#ffebee;color:#c62828}
    .pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 0;flex-wrap:wrap}
    .pagination .page-btn{padding:6px 10px;border:2px solid #000;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;font-family:inherit;text-align:center;line-height:1}
    .pagination .page-btn:hover{background:#f5f5f5}
    .pagination .page-btn.prim{background:#000;color:#fff;border-color:#000}
    .pagination .page-btn:disabled{opacity:.3;cursor:default}
    .pagination .page-num{font-size:11px;font-weight:700;color:#000;cursor:pointer;padding:4px 8px;border-radius:6px;border:2px solid transparent;min-width:28px;text-align:center;background:0 0;font-family:inherit;line-height:1}
    .pagination .page-num:hover{border-color:#000}
    .pagination .page-num-inp{width:50px;padding:4px 6px;border:2px solid #000;border-radius:6px;font-size:11px;font-weight:700;text-align:center;font-family:inherit;outline:none}
    .empty{padding:60px 20px;text-align:center;color:#999;font-size:14px}
    .login-form{max-width:360px;margin:60px auto;padding:32px 28px;background:#fff;border:3px solid #000;box-shadow:12px 12px 0 #000}
    .login-form h2{font-size:20px;font-weight:900;margin-bottom:4px}
    .login-form .sub{font-size:12px;color:#888;margin-bottom:20px}
    .login-form input{display:block;width:100%;padding:12px 14px;border:2px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;margin-bottom:12px}
    .login-form input:focus{border-color:#000}
    .login-form button{width:100%;padding:12px;border:none;border-radius:8px;background:#000;color:#fff;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
    .login-form button:hover{background:#333}
    .login-form .err{font-size:12px;color:#c62828;font-weight:600;margin-top:10px}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:99999;animation:fade .3s}
    @keyframes fade{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @media(min-width:600px){.cards{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="wrap" id="adminWrap">
  <div class="top-bar">
    <div class="left"><a href="../index.html">&larr; Back to Admin</a></div>
    <button class="refresh" onclick="syncFromSupabase(true)">Refresh</button>
  </div>
  <h1>Withdrawals</h1>
  <div class="sub" id="count">Loading...</div>
  <div class="stats">
    <div class="s"><div class="num" id="totalAll">-</div><div class="lbl">Total</div></div>
    <div class="s"><div class="num st" id="totalCompleted">-</div><div class="lbl">Completed</div></div>
    <div class="s"><div class="num sp" id="totalPending">-</div><div class="lbl">Pending</div></div>
    <div class="s"><div class="num sr" id="totalRejected">-</div><div class="lbl">Rejected</div></div>
  </div>
  <button class="filter-toggle" onclick="toggleFilters()">Filters &#9660;</button>
  <div class="filters" id="filtersWrap">
    <div class="fg">
      <span class="fl">Status</span>
      <button class="fbtn active" data-group="status" data-val="all" onclick="setFilter('status','all')">All</button>
      <button class="fbtn" data-group="status" data-val="pending" onclick="setFilter('status','pending')">Pending</button>
      <button class="fbtn" data-group="status" data-val="completed" onclick="setFilter('status','completed')">Completed</button>
      <button class="fbtn" data-group="status" data-val="rejected" onclick="setFilter('status','rejected')">Rejected</button>
    </div>
    <div class="sep"></div>
    <div class="fg">
      <span class="fl">Method</span>
      <button class="fbtn active" data-group="method" data-val="all" onclick="setFilter('method','all')">All</button>
      <button class="fbtn" data-group="method" data-val="easypaisa" onclick="setFilter('method','easypaisa')">EasyPaisa</button>
      <button class="fbtn" data-group="method" data-val="jazzcash" onclick="setFilter('method','jazzcash')">JazzCash</button>
    </div>
    <div class="sep"></div>
    <div class="fg">
      <span class="fl">Flag</span>
      <button class="fbtn active" data-group="suspicious" data-val="all" onclick="setFilter('suspicious','all')">All</button>
      <button class="fbtn" data-group="suspicious" data-val="yes" onclick="setFilter('suspicious','yes')">Suspicious Only</button>
    </div>
    <div class="sep"></div>
    <div class="fg" style="flex:1;min-width:180px">
      <span class="fl">Search</span>
      <input type="text" id="searchInput" placeholder="Email or account number..." oninput="searchChange()" style="padding:6px 10px;border:2px solid #000;border-radius:8px;font-size:11px;font-weight:600;font-family:inherit;outline:none;flex:1;min-width:120px;background:#fff">
    </div>
    <div class="sep"></div>
    <div class="fg">
      <span class="fl">View</span>
      <button class="fbtn active" data-view="cards" onclick="setView('cards')">Cards</button>
      <button class="fbtn" data-view="users" onclick="setView('users')">Users</button>
      <span id="userFilterBadge" style="display:none;font-size:11px;font-weight:600;color:#888;padding:4px 8px;line-height:28px"></span>
    </div>
  </div>
  <div class="pagination" id="paginationTop"></div>
  <div class="cards" id="list"></div>
  <div class="pagination" id="paginationBot"></div>
</div>

<script>
  const SUPABASE_URL = 'https://kievjssavmcxnjfiagso.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZXZqc3Nhdm1jeG5qZmlhZ3NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NjE3OTEsImV4cCI6MjA5OTIzNzc5MX0.9HHdiJx1iYI1F4oNzOJnV3ZZ425A2q090eukj45A5SI';
  const ADMIN_EMAIL = 'support@admeva.online';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  var allData = [];
  var filters = { status: 'all', method: 'all', suspicious: 'all' };
  var filtersVisible = true;
  var PER_PAGE = 5;
  var currentPage = 1;
  var CACHE_KEY = 'admeva_admin_withdrawals';
  var currentView = 'cards';
  var userFilterEmail = null;
  var searchQuery = '';

  function searchChange() {
    searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    currentPage = 1;
    renderCards();
  }

  function toggleFilters() {
    filtersVisible = !filtersVisible;
    document.getElementById('filtersWrap').classList.toggle('hidden', !filtersVisible);
    document.querySelector('.filter-toggle').innerHTML = 'Filters ' + (filtersVisible ? '\u25BC' : '\u25B6');
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove() }, 2000);
  }

  function goToPage(p) {
    if (p < 1) p = 1;
    if (p > totalPages) p = totalPages;
    currentPage = p;
    renderCards();
  }

  function editPage(el, total) {
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'page-num-inp';
    inp.value = currentPage;
    inp.maxLength = 5;
    el.parentNode.replaceChild(inp, el);
    inp.focus();
    inp.select();
    function done() {
      var v = parseInt(inp.value, 10);
      if (v > 0 && v <= total) goToPage(v);
      renderPagination(total);
    }
    inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') done() });
    inp.addEventListener('blur', done);
  }

  var totalPages = 1;

  function renderPagination(total) {
    totalPages = total;
    var prevDisabled = currentPage <= 1 ? ' disabled' : '';
    var nextDisabled = currentPage >= total ? ' disabled' : '';
    var html = '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')"' + prevDisabled + '>&lsaquo;</button>';
    html += '<span class="page-num" onclick="editPage(this,' + total + ')" title="Click to change page">' + currentPage + '/' + total + '</span>';
    html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')"' + nextDisabled + '>&rsaquo;</button>';
    document.getElementById('paginationTop').innerHTML = html;
    document.getElementById('paginationBot').innerHTML = html;
  }

  function setView(v) {
    currentView = v;
    document.querySelectorAll('.fbtn[data-view]').forEach(function(b) { b.classList.toggle('active', b.dataset.view === v) });
    userFilterEmail = null;
    document.getElementById('userFilterBadge').style.display = 'none';
    document.getElementById('userFilterBadge').innerHTML = '';
    renderCards();
  }

  function filterByUser(email) {
    userFilterEmail = email;
    currentView = 'cards';
    document.querySelectorAll('.fbtn[data-view]').forEach(function(b) { b.classList.toggle('active', b.dataset.view === 'cards') });
    document.getElementById('userFilterBadge').innerHTML = 'Showing: ' + email + ' <span onclick="setView(\'users\')" style="cursor:pointer;color:#1565c0;text-decoration:underline;margin-left:4px">Clear</span>';
    document.getElementById('userFilterBadge').style.display = 'inline';
    renderCards();
  }

  function setFilter(group, val) {
    filters[group] = val;
    document.querySelectorAll('.fbtn[data-group="' + group + '"]').forEach(function(b) { b.classList.toggle('active', b.dataset.val === val) });
    currentPage = 1;
    renderCards();
  }

  async function updateStatus(id, newStatus, btn) {
    btn.disabled = true;
    btn.textContent = '...';
    var { error } = await sb.from('withdrawals').update({ status: newStatus }).eq('id', id);
    if (error) { toast('Error: ' + error.message); btn.disabled = false; btn.textContent = 'Save'; return; }
    // update localStorage without refetching all
    for (var i = 0; i < allData.length; i++) {
      if (allData[i].id === id) { allData[i].status = newStatus; break; }
    }
    saveCache();
    toast('Status updated to ' + newStatus);
    renderCards();
  }

  async function checkAuth() {
    var { data: { session } } = await sb.auth.getSession();
    var email = session ? session.user.email : localStorage.getItem('admeva_session');
    if (email === ADMIN_EMAIL) { localStorage.setItem('admeva_session', ADMIN_EMAIL); return true; }
    // show login form
    document.getElementById('adminWrap').innerHTML =
      '<div class="login-form">' +
        '<h2>Admin Login</h2>' +
        '<div class="sub">Sign in with admin account</div>' +
        '<input type="email" id="loginEmail" placeholder="Email" value="' + ADMIN_EMAIL + '">' +
        '<input type="password" id="loginPass" placeholder="Password">' +
        '<button id="loginBtn" onclick="adminLogin()">Sign In</button>' +
        '<div class="err" id="loginErr"></div>' +
      '</div>';
    return false;
  }

  async function adminLogin() {
    var email = document.getElementById('loginEmail').value.trim();
    var pass = document.getElementById('loginPass').value;
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginErr');
    if (!email || !pass) { err.textContent = 'Enter email and password.'; return; }
    btn.disabled = true; btn.textContent = 'Signing in...'; err.textContent = '';
    var { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (error) { err.textContent = error.message; btn.disabled = false; btn.textContent = 'Sign In'; return; }
    if (email !== ADMIN_EMAIL) { err.textContent = 'Access denied: Not an admin account.'; btn.disabled = false; btn.textContent = 'Sign In'; return; }
    localStorage.setItem('admeva_session', email);
    location.reload();
  }

  function renderCards() {
    // find suspicious account numbers (same acc used by multiple emails)
    var accMap = {};
    allData.forEach(function(w) {
      if (!w.account_number) return;
      if (!accMap[w.account_number]) accMap[w.account_number] = new Set();
      accMap[w.account_number].add(w.user_email);
    });
    var suspAccs = {};
    Object.keys(accMap).forEach(function(acc) { if (accMap[acc].size > 1) suspAccs[acc] = true });

    // apply filters
    var filtered = [];
    allData.forEach(function(w) {
      if (userFilterEmail && w.user_email !== userFilterEmail) return;
      if (filters.status !== 'all') {
        var st = w.status === 'approved' ? 'completed' : w.status;
        if (st !== filters.status) return;
      }
      if (filters.method !== 'all' && w.method !== filters.method) return;
      if (filters.suspicious === 'yes' && !(w.account_number && suspAccs[w.account_number])) return;
      if (searchQuery) {
        var email = (w.user_email || '').toLowerCase();
        var acc = (w.account_number || '').toLowerCase();
        if (email.indexOf(searchQuery) === -1 && acc.indexOf(searchQuery) === -1) return;
      }
      filtered.push(w);
    });

    // ─── USERS VIEW ────────────────────────────────
    if (currentView === 'users') {
      // aggregate by user
      var userMap = {};
      filtered.forEach(function(w) {
        if (!userMap[w.user_email]) userMap[w.user_email] = { email: w.user_email, total: 0, completed: 0, pending: 0, rejected: 0, name: w.account_name || '', totalAmount: 0 };
        var u = userMap[w.user_email];
        u.total++;
        u.totalAmount += (w.amount || 0);
        if (w.status === 'completed' || w.status === 'approved') u.completed++;
        else if (w.status === 'rejected') u.rejected++;
        else u.pending++;
      });
      var users = Object.keys(userMap).map(function(k) { return userMap[k]; });
      users.sort(function(a, b) { return b.total - a.total });

      var html = users.map(function(u) {
        return '<div class="usercard" onclick="filterByUser(\'' + u.email + '\')">' +
          '<div class="uc-top"><div class="uc-email">' + (u.name ? u.name + '<br><span style="font-size:11px;color:#888;font-weight:500">' + u.email + '</span>' : u.email) + '</div><div class="uc-total">' + u.total + '</div></div>' +
          '<div class="uc-stats">' +
            '<div class="uc-s"><div class="uc-num st">' + u.completed + '</div><div class="uc-lbl">Completed</div></div>' +
            '<div class="uc-s"><div class="uc-num sp">' + u.pending + '</div><div class="uc-lbl">Pending</div></div>' +
            '<div class="uc-s"><div class="uc-num sr">' + u.rejected + '</div><div class="uc-lbl">Rejected</div></div>' +
          '</div></div>';
      }).join('');

      document.getElementById('list').innerHTML = html || '<div class="empty">No users match your filters.</div>';
      document.getElementById('paginationTop').innerHTML = '';
      document.getElementById('paginationBot').innerHTML = '';
      document.getElementById('totalAll').textContent = filtered.length;
      document.getElementById('totalCompleted').textContent = filtered.filter(function(w) { return w.status === 'completed' || w.status === 'approved' }).length;
      document.getElementById('totalPending').textContent = filtered.filter(function(w) { return w.status !== 'completed' && w.status !== 'approved' && w.status !== 'rejected' }).length;
      document.getElementById('totalRejected').textContent = filtered.filter(function(w) { return w.status === 'rejected' }).length;
      return;
    }

    // ─── CARDS VIEW ────────────────────────────────
    // per-user stats for card display
    var userStats = {};
    filtered.forEach(function(w) {
      if (!userStats[w.user_email]) userStats[w.user_email] = { total: 0, completed: 0, pending: 0, rejected: 0 };
      var us = userStats[w.user_email];
      us.total++;
      if (w.status === 'completed' || w.status === 'approved') us.completed++;
      else if (w.status === 'rejected') us.rejected++;
      else us.pending++;
    });

    var totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PER_PAGE;
    var pageItems = filtered.slice(start, start + PER_PAGE);

    var stats = { all: filtered.length, completed: 0, pending: 0, rejected: 0 };
    filtered.forEach(function(w) {
      if (w.status === 'completed' || w.status === 'approved') stats.completed++;
      else if (w.status === 'rejected') stats.rejected++;
      else stats.pending++;
    });

    var cards = '';
    pageItems.forEach(function(w) {
      var isSusp = w.account_number && suspAccs[w.account_number];
      var date = w.created_at ? new Date(w.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
      var methodName = { easypaisa: 'EasyPaisa', jazzcash: 'JazzCash' }[w.method] || w.method || '-';
      var statusClass = w.status === 'completed' || w.status === 'approved' ? 'completed' : w.status === 'rejected' ? 'rejected' : 'pending';
      var statusLabel = w.status === 'approved' ? 'completed' : w.status;
      var statusOpts = '<option value="pending"' + (w.status === 'pending' ? ' selected' : '') + '>Pending</option><option value="completed"' + (w.status === 'completed' || w.status === 'approved' ? ' selected' : '') + '>Completed</option><option value="rejected"' + (w.status === 'rejected' ? ' selected' : '') + '>Rejected</option>';

      var us = userStats[w.user_email] || { total: 0, completed: 0, pending: 0, rejected: 0 };
      var userStatLine = '<div style="font-size:10px;color:#999;border-top:1px solid #eee;margin-top:8px;padding-top:8px;display:flex;gap:10px">' +
        '<span><strong>' + us.total + '</strong> Total</span>' +
        '<span style="color:#2e7d32"><strong>' + us.completed + '</strong> Done</span>' +
        '<span style="color:#e65100"><strong>' + us.pending + '</strong> Pending</span>' +
        '<span style="color:#c62828"><strong>' + us.rejected + '</strong> Rejected</span></div>';

      cards += '<div class="card' + (isSusp ? ' suspicious' : '') + '" data-id="' + w.id + '">' +
        (isSusp ? '<span class="susp-badge">Suspicious</span>' : '') +
        '<div class="top"><div class="user">' + (w.account_name || '-') + '<div class="email">' + (w.user_email || '') + '</div></div><div class="amt">\u20B9' + (w.amount || 0) + '</div></div>' +
        '<div class="info">' +
          '<div><div class="lbl">Method</div><div class="val">' + methodName + '</div></div>' +
          '<div><div class="lbl">Account Number</div><div class="val">' + (w.account_number || '-') + ' <button class="copy" onclick="var t=this;navigator.clipboard?navigator.clipboard.writeText(\'' + (w.account_number || '') + '\').then(function(){toast(\'Copied!\')}):(function(){var e=document.createElement(\'textarea\');e.value=\'' + (w.account_number || '') + '\';document.body.appendChild(e);e.select();document.execCommand(\'copy\');e.remove();toast(\'Copied!\')})()">Copy</button></div></div>' +
        '</div>' +
        userStatLine +
        '<div class="bot"><div><span class="badge ' + statusClass + '">' + statusLabel + '</span><div class="date">' + date + '</div></div>' +
        '<div class="actions"><select id="sel-' + w.id + '">' + statusOpts + '</select><button class="save-btn" onclick="updateStatus(\'' + w.id + '\',document.getElementById(\'sel-' + w.id + '\').value,this)">Save</button></div></div></div>';
    });

    document.getElementById('list').innerHTML = cards || '<div class="empty">No withdrawals match your filters.</div>';
    document.getElementById('totalAll').textContent = stats.all;
    document.getElementById('totalCompleted').textContent = stats.completed;
    document.getElementById('totalPending').textContent = stats.pending;
    document.getElementById('totalRejected').textContent = stats.rejected;
    renderPagination(totalPages);
  }

  var lastCreatedAt = null;

  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(allData));
      if (lastCreatedAt) localStorage.setItem(CACHE_KEY + '_last', lastCreatedAt);
    } catch(e) {}
  }
  function loadCache() {
    try {
      var d = localStorage.getItem(CACHE_KEY);
      if (d) { allData = JSON.parse(d); lastCreatedAt = localStorage.getItem(CACHE_KEY + '_last') || null; return true; }
    } catch(e) {}
    return false;
  }

  function findLastCreatedAt(arr) {
    var max = null;
    arr.forEach(function(w) { if (w.created_at && (!max || w.created_at > max)) max = w.created_at; });
    return max;
  }

  async function syncFromSupabase(isRefresh) {
    var q = sb.from('withdrawals')
      .select('id,user_email,amount,method,account_name,account_number,status,created_at');
    if (isRefresh && lastCreatedAt) {
      q = q.gt('created_at', lastCreatedAt);
    }
    q = q.order('created_at', { ascending: false });
    var { data, error } = await q;
    if (error) return;
    if (isRefresh && lastCreatedAt) {
      // only new ones — prepend, never replace existing
      if (data && data.length > 0) {
        var existingIds = {};
        allData.forEach(function(w) { existingIds[w.id] = true; });
        data.forEach(function(w) {
          if (!existingIds[w.id]) { allData.unshift(w); }
        });
        lastCreatedAt = findLastCreatedAt(allData);
      }
      // if no new data, allData stays untouched
    } else {
      allData = data || [];
      lastCreatedAt = findLastCreatedAt(allData);
    }
    saveCache();
    renderCards();
  }

  async function loadData() {
    if (!await checkAuth()) return;
    // show cached immediately
    if (loadCache()) {
      document.getElementById('count').textContent = allData.length + ' withdrawal' + (allData.length === 1 ? '' : 's') + ' (cached)';
      renderCards();
    } else {
      document.getElementById('count').textContent = 'Loading...';
    }
    // background sync — on first load, fetch ALL
    await syncFromSupabase(false);
    document.getElementById('count').textContent = allData.length + ' withdrawal' + (allData.length === 1 ? '' : 's');
  }

  loadData();
</script>
</body>
</html>
